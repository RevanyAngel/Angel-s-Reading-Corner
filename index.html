<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Angel's Reading Corner — Your personal book tracker to remember every insight from every book you've read.">
  <title>Angel's Reading Corner</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">

</head>
<body>
  <main class="landing-page">
    <!-- Background -->
    <div class="landing-bg">
      <div class="landing-overlay"></div>
    </div>

    <!-- Content -->
    <div class="landing-content">
      <!-- Title -->
      <header class="landing-header animate-slide-up">
        <h1 class="app-title">Angel's Reading Corner</h1>
        <p class="app-subtitle">Where every page finds a memory</p>

      </header>

      <!-- Auth Buttons (shown when not logged in) -->
      <div id="auth-section" class="auth-section" style="display: none;">
        <div class="auth-buttons">
          <button id="btn-google-signin" class="btn-google" aria-label="Sign in with Google">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
              <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
              <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
              <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
            </svg>
            <span>Sign in with Google</span>
          </button>

          <div class="auth-divider">
            <span>atau</span>
          </div>

          <button id="btn-guest-signin" class="btn-guest" aria-label="Masuk sebagai Tamu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Masuk Tanpa Login (Tamu)</span>
          </button>
        </div>
      </div>

      <!-- Quote of the Day (shown when logged in) -->
      <div id="quote-section" class="quote-section" style="display: none;">
        <div class="glass-card quote-card">
          <div class="quote-inner">
            <div id="quote-cover" class="quote-cover">
              <img id="quote-cover-img" src="" alt="Book cover">
            </div>
            <div class="quote-text">
              <p id="quote-note-title" class="quote-note-title"></p>
              <p id="quote-note-desc" class="quote-note-desc"></p>
              <p id="quote-book-title" class="quote-book-title"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Welcome message (when no notes) -->
      <div id="welcome-section" class="welcome-section" style="display: none;">
        <div class="glass-card quote-card">
          <div class="welcome-inner">
          <span class="welcome-emoji">&#9998;</span>
          <p class="welcome-text">Welcome! Start by adding your first book to see insights here.</p>
        </div>

        </div>
      </div>

      <!-- CTA: Bookshelf -->
      <div id="cta-section" class="cta-section" style="display: none;">
        <a href="library.html" class="bookshelf-cta" aria-label="Go to your library">
          <div class="cta-sparkles">
            <span class="sparkle s1">✦</span>
            <span class="sparkle s2">✧</span>
            <span class="sparkle s3">✦</span>
            <span class="sparkle s4">⋆</span>
            <span class="sparkle s5">✧</span>
          </div>
          <div class="cta-content">
            <span class="cta-icon" style="font-size:1.1rem; letter-spacing:0.02em;">&#9998;</span>
            <span class="cta-text">Enter Library</span>
            <span class="cta-arrow">→</span>
          </div>

        </a>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script type="module" src="js/landing.js"></script>
</body>
</html>
